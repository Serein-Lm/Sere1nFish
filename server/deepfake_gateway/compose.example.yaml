version: "2.4"

services:
  meanvc:
    image: sere1nfish/meanvc-runtime:1.0.0
    build:
      context: ../meanvc_runtime
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY-http://127.0.0.1:17890}
        HTTPS_PROXY: ${HTTPS_PROXY-http://127.0.0.1:17890}
    restart: unless-stopped
    network_mode: host
    runtime: nvidia
    shm_size: 2gb
    environment:
      HTTP_PROXY: ${HTTP_PROXY-http://127.0.0.1:17890}
      HTTPS_PROXY: ${HTTPS_PROXY-http://127.0.0.1:17890}
      NO_PROXY: localhost,127.0.0.1,::1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MEANVC_API_TOKEN_FILE: /run/secrets/meanvc_api_token
      MEANVC_MODEL_DIR: /models
      HOME: /models
      MEANVC_DEVICE: ${MEANVC_DEVICE-auto}
      MEANVC_CPU_THREADS: ${MEANVC_CPU_THREADS-2}
      MEANVC_MAX_SESSIONS: ${DEEPFAKE_MAX_SESSIONS-2}
      MEANVC_SESSION_TTL_SECONDS: ${DEEPFAKE_SESSION_TTL_SECONDS-900}
    volumes:
      - ${MEANVC_MODELS_DIR-../data/meanvc}:/models
      - ${MEANVC_TOKEN_FILE-../secrets/meanvc-token}:/run/secrets/meanvc_api_token:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 300s

  gateway:
    image: sere1nfish/deepfake-gateway:1.5.1
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    runtime: nvidia
    shm_size: 2gb
    depends_on:
      meanvc:
        condition: service_started
    environment:
      HTTP_PROXY: ${HTTP_PROXY-http://127.0.0.1:17890}
      HTTPS_PROXY: ${HTTPS_PROXY-http://127.0.0.1:17890}
      NO_PROXY: localhost,127.0.0.1,::1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      DEEPFAKE_API_TOKEN_FILE: /run/secrets/deepfake_api_token
      DEEPFAKE_MAX_SESSIONS: ${DEEPFAKE_MAX_SESSIONS:-2}
      DEEPFAKE_MAX_SOURCE_IMAGES: ${DEEPFAKE_MAX_SOURCE_IMAGES:-4}
      DEEPFAKE_SESSION_TTL_SECONDS: ${DEEPFAKE_SESSION_TTL_SECONDS:-900}
      DEEPFAKE_DEFAULT_IMAGE_PROFILE: ${DEEPFAKE_DEFAULT_IMAGE_PROFILE:-quality}
      DEEPFAKE_DEFAULT_REALTIME_PROFILE: ${DEEPFAKE_DEFAULT_REALTIME_PROFILE:-fast}
      DEEPFAKE_MEDIA_ENABLED: "1"
      DEEPFAKE_MEDIA_PUBLIC_BASE_URL: https://${DEEPFAKE_PUBLIC_HOST:-121-40-145-239.sslip.io}
      DEEPFAKE_MEDIA_RTSP_BASE_URL: rtsp://127.0.0.1:8554
      DEEPFAKE_MEDIA_OUTPUT_FPS: ${DEEPFAKE_MEDIA_OUTPUT_FPS:-15}
      DEEPFAKE_MEDIA_ENCODER: ${DEEPFAKE_MEDIA_ENCODER:-h264_nvenc}
      DEEPFAKE_MEDIA_VIDEO_BITRATE: ${DEEPFAKE_MEDIA_VIDEO_BITRATE:-1800k}
      DEEPFAKE_MEDIA_AUDIO_BITRATE: ${DEEPFAKE_MEDIA_AUDIO_BITRATE:-64k}
      DEEPFAKE_MEDIA_AUDIO_BUFFER_MS: ${DEEPFAKE_MEDIA_AUDIO_BUFFER_MS:-300}
      DEEPFAKE_MEDIA_SHUTDOWN_TIMEOUT_SECONDS: ${DEEPFAKE_MEDIA_SHUTDOWN_TIMEOUT_SECONDS:-6}
      DEEPFAKE_VOICE_CONVERTER_BASE_URL: http://127.0.0.1:8766
      DEEPFAKE_VOICE_CONVERTER_TOKEN_FILE: /run/secrets/meanvc_api_token
    volumes:
      - ${DEEPFAKE_ASSETS_DIR:-../data/assets}:/opt/facefusion/.assets
      - ${DEEPFAKE_CACHE_DIR:-../data/cache}:/opt/facefusion/.caches
      - ${DEEPFAKE_FACEFUSION_CONFIG_FILE:-./facefusion.ini}:/opt/facefusion/facefusion.ini:ro
      - ${DEEPFAKE_TOKEN_FILE:-../secrets/api-token}:/run/secrets/deepfake_api_token:ro
      - ${MEANVC_TOKEN_FILE-../secrets/meanvc-token}:/run/secrets/meanvc_api_token:ro
    command:
      - --host
      - 127.0.0.1
      - --port
      - "8443"
      - --workers
      - "1"
      - --no-access-log

  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    restart: unless-stopped
    network_mode: host
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${DEEPFAKE_WEBRTC_ADDITIONAL_HOSTS:-121.40.145.239}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
      - mediamtx
    environment:
      DEEPFAKE_PUBLIC_HOST: ${DEEPFAKE_PUBLIC_HOST:-121-40-145-239.sslip.io}
      DEEPFAKE_LEGACY_HOST: ${DEEPFAKE_LEGACY_HOST:-121.40.145.239}
      DEEPFAKE_TUNNEL_HOST: ${DEEPFAKE_TUNNEL_HOST:-172.18.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEEPFAKE_TLS_CERT_FILE:-../secrets/tls.crt}:/etc/caddy/legacy/tls.crt:ro
      - ${DEEPFAKE_TLS_KEY_FILE:-../secrets/tls.key}:/etc/caddy/legacy/tls.key:ro
      - ${DEEPFAKE_CADDY_DATA_DIR:-../data/caddy}:/data
      - ${DEEPFAKE_CADDY_CONFIG_DIR:-../data/caddy-config}:/config
